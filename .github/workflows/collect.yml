name: collect

on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill N days (leave empty for a normal run)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BACKFILL: ${{ inputs.backfill_days }}
        run: python -m collector.collect ${BACKFILL:+--backfill-days "$BACKFILL"}
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/purchases.json collector/state.json
          git diff --cached --quiet || (git commit -m "data: update purchases" && git push)
